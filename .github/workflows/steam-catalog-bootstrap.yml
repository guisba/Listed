name: Steam catalog bootstrap (legacy public AppList)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and count the Valve response without writing to Supabase
        required: true
        type: boolean
        default: true
      max_batches:
        description: Optional safe batch limit (empty means all batches)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: steam-catalog-bootstrap-listed
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run download
        if: ${{ inputs.dry_run }}
        run: npm run steam:catalog:bootstrap-legacy -- --dry-run

      - name: Validate secret configuration
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"

      - name: Download and bootstrap catalog
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_BATCHES: ${{ inputs.max_batches }}
        shell: bash
        run: |
          args=()
          if [[ -n "$MAX_BATCHES" ]]; then
            [[ "$MAX_BATCHES" =~ ^[0-9]+$ ]] || { echo 'max_batches must be a positive integer'; exit 2; }
            args+=("--max-batches=$MAX_BATCHES")
          fi
          npm run steam:catalog:bootstrap-legacy -- "${args[@]}"

      - name: Publish safe catalog summary
        if: ${{ always() && inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          echo '## Steam catalog status' >> "$GITHUB_STEP_SUMMARY"
          npm run --silent steam:catalog:status >> "$GITHUB_STEP_SUMMARY" || echo 'Status unavailable.' >> "$GITHUB_STEP_SUMMARY"
